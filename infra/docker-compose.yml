version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: checkout_postgres
    environment:
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: checkout
      POSTGRES_DB: checkout
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: checkout_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
